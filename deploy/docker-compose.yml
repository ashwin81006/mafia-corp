services:
  postgres:
    image: postgres:16-alpine
    container_name: mafiacorp-db
    restart: always
    environment:
      POSTGRES_DB: MafiaCorpDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SuperSecurePassword123!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mafianet

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: mafiacorp-api
    restart: always
    depends_on:
      - postgres
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=MafiaCorpDB;Username=postgres;Password=${DB_PASSWORD:-SuperSecurePassword123!}
      - ASPNETCORE_URLS=http://+:5130
      - InternalApiSecret=SuperSecretKeyForInternalJavaServer123!
    ports:
      - "5130:5130"
    networks:
      - mafianet

  gameserver:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gameserver
    container_name: mafiacorp-gameserver
    restart: always
    depends_on:
      - api
    environment:
      - API_URL=http://api:5130
    ports:
      - "54555:54555"
    networks:
      - mafianet

volumes:
  postgres_data:

networks:
  mafianet:
    driver: bridge
